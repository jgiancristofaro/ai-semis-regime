name: Daily refresh

# Rebuilds the report from fresh market data and publishes it to GitHub Pages.
on:
  schedule:
    - cron: "17 22 * * 1-5"   # 22:17 UTC weekdays = 5:17pm ET (winter) / 6:17pm ET (summer), after the US close
  workflow_dispatch:           # "Run workflow" button for a manual refresh
  push:
    branches: [main]
    paths: ["analysis/**", ".github/workflows/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch prices, rerun analyses, build page
        run: python analysis/update.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
