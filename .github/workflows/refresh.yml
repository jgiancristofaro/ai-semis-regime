name: Daily refresh

# Rebuilds the report from fresh market data, records daily snapshots, and publishes to GitHub Pages.
on:
  schedule:
    - cron: "17 22 * * 1-5"   # 22:17 UTC weekdays = 5:17pm ET (winter) / 6:17pm ET (summer), after the US close
  workflow_dispatch:           # "Run workflow" button for a manual refresh
  push:
    branches: [main]
    paths: ["analysis/**", ".github/workflows/**"]

permissions:
  contents: write   # commit research/snapshots/ (history that has no free source)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch data, rerun analyses, build page
        run: python analysis/update.py
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}

      - name: Commit new snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/snapshots
          if git diff --cached --quiet; then echo "no new snapshots"; exit 0; fi
          git commit -m "Daily snapshot $(date -u +%F)"
          git pull --rebase origin main && git push origin HEAD:main

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
